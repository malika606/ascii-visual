name: Verify ASCII Visual
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify supplied demo asset
        run: echo 'f3d31428c712d3ef73677b9819906bf59cde6afe58b6f56591e3e73417e58a8b  src/assets/demo-cat.gif' | sha256sum -c -
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Start Vite
        id: vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/ascii-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
      - name: Browser smoke against Vite
        run: ASCII_TEST_URL=http://127.0.0.1:5173 python tests/ui_smoke.py
      - name: Hero lifecycle
        if: always() && steps.vite.outcome == 'success'
        run: ASCII_TEST_URL=http://127.0.0.1:5173 ASCII_SCREENSHOTS=artifacts/screenshots python tests/hero_smoke.py
      - name: Studio screenshots
        if: always() && steps.vite.outcome == 'success'
        run: ASCII_TEST_URL=http://127.0.0.1:5173 ASCII_SCREENSHOTS=artifacts/screenshots python tests/studio_screens.py
      - name: Rendering quality audit
        if: always() && steps.vite.outcome == 'success'
        run: ASCII_TEST_URL=http://127.0.0.1:5173 ASCII_SCREENSHOTS=artifacts/screenshots python tests/quality_audit.py
      - name: Upload actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascii-visual-browser-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore
